  # BEGIN STT_TITAN_COCKPIT
  location = /stt { return 301 /stt/; }

  location ^~ /stt/ {
    proxy_pass http://127.0.0.1:8055/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /stt;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Dashboard-User $remote_user;
    include /etc/nginx/snippets/stt-proxy-secret.conf;
    proxy_set_header Authorization "";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;

    auth_basic "STT Institutional Cockpit";
    auth_basic_user_file /etc/nginx/.htpasswd-stt;

    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com;" always;
  }
  # END STT_TITAN_COCKPIT
