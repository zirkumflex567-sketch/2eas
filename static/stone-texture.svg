<defs>
<linearGradient id="slab" x1="0" x2="1" y1="0" y2="1">
  <stop stop-color="#728087" stop-opacity=".45"/><stop offset=".32" stop-color="#19242a"/>
  <stop offset=".66" stop-color="#323e43"/><stop offset="1" stop-color="#10181d"/>
</linearGradient>
<radialGradient id="wear"><stop stop-color="#a4a9a7" stop-opacity=".4"/><stop offset="1" stop-color="#9aa1a6" stop-opacity="0"/></radialGradient>
<filter id="granite" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence baseFrequency=".019 .032" numOctaves="5" seed="17" type="fractalNoise" result="f"/>
  <feColorMatrix in="f" type="saturate" values="0" result="gray"/>
  <feComponentTransfer in="gray" result="steep">
     <feFuncR type="gamma" amplitude="1" exponent="1.4" offset="0"/>
     <feFuncG type="gamma" amplitude="1" exponent="1.4" offset="0"/>
     <feFuncB type="gamma" amplitude="1" exponent="1.4" offset="0"/>
     <feFuncA type="linear" slope=".18"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="steep" mode="screen"/>
</filter>
<filter id="rockRelief">
   <feTurbulence type="fractalNoise" baseFrequency=".005 .016" numOctaves="4" seed="9" result="noise"/>
   <feDiffuseLighting in="noise" surfaceScale="3" lighting-color="#c2ced0" result="light">
     <feDistantLight azimuth="307" elevation="57"/>
   </feDiffuseLighting>
   <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
</filter>
<filter id="glow"><feGaussianBlur stdDeviation="2.6"/></filter>
</defs>
