<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Studio beta browser smoke fixture (never live MT5)</title>
<style>body{background:#071521;color:white;margin:12px;font-family:system-ui}.glass-card{background:#142e3b;border:1px solid #66818b;border-radius:10px;padding:12px;width:min(100%,1080px);box-sizing:border-box}#tv-chart{width:100%;height:520px}.frame{width:100%;height:520px;position:relative}button{cursor:pointer}</style>
<link rel="stylesheet" href="stone-asset-skin.css"></head>
<body><div class="glass-card"><div><strong>XAUUSD M15 DEMO · READ ONLY</strong> <button id="stone-chart-expand-btn">GROSS</button></div>
<div class="frame"><div id="tv-chart"></div></div></div>
<script src="lightweight-charts.js"></script>
<script src="stone-chart-effects.js"></script>
<script src="chart-studio-data-signature.js"></script>
  <script src="chart-studio-indicator-extensions.js"></script>
  <script src="chart-studio-indicators.js"></script>
  <script src="chart-studio-alerts.js"></script>
  <script src="chart-studio-market-structure.js"></script>
<script src="chart-studio-server-sync.js"></script>
<script src="chart-studio-drawing-geometry.js"></script>
<script src="chart-studio-averages.js"></script>
  <script src="chart-studio-appearance.js"></script>
  <script src="chart-studio-oscillators.js"></script>
  <script src="chart-studio-chart-types.js"></script>
  <script src="chart-studio-object-manager.js"></script>
  <link rel="stylesheet" href="chart-studio-quick.css">
  <script src="chart-studio-catalog.js"></script>\n  <script src="chart-studio-replay.js"></script>
  <script src="chart-studio-fib.js"></script>
  <script src="chart-studio-export.js"></script>
  <script src="chart-studio-broker-panel.js"></script>
  <script src="chart-studio-ticket-draft.js"></script>
  <script src="chart-studio-mtf.js"></script>
  <script src="chart-studio-mtf-panel.js"></script>
  <link rel="stylesheet" href="chart-studio-multi-chart.css">
  <script src="chart-studio-multi-chart.js"></script>
  <script src="chart-studio-beta.js"></script>
<script>
const host=document.getElementById("tv-chart");
const chart=LightweightCharts.createChart(host,{width:host.clientWidth,height:host.clientHeight,
 layout:{background:{color:"#071721"},textColor:"#c3dbe4"},
 timeScale:{timeVisible:true,rightOffset:7,barSpacing:7}});
window.__chart=chart;
window.__chartCrosshairSubscribers=[];
const subscribeCrosshairMove=chart.subscribeCrosshairMove.bind(chart);
const unsubscribeCrosshairMove=chart.unsubscribeCrosshairMove.bind(chart);
chart.subscribeCrosshairMove=callback=>{window.__chartCrosshairSubscribers.push(callback);subscribeCrosshairMove(callback)};
chart.unsubscribeCrosshairMove=callback=>{window.__chartCrosshairSubscribers=window.__chartCrosshairSubscribers.filter(item=>item!==callback);unsubscribeCrosshairMove(callback)};
const scale=chart.timeScale(),timeToCoordinate=scale.timeToCoordinate.bind(scale);
window.__chartTimeLookups=[];scale.timeToCoordinate=time=>{window.__chartTimeLookups.push(time);return timeToCoordinate(time)};
const candleSeries=chart.addCandlestickSeries({upColor:"#1acc92",downColor:"#ef6781"});
const emas=[
 chart.addLineSeries({color:"#2dddfb"}),
 chart.addLineSeries({color:"#ffbd6c"}),
 chart.addLineSeries({color:"#b89aff"})
];
const base=1700000000;
const candles=Array.from({length:120},(_,i)=>{
 const price=4100+Math.sin(i/8)*12+i*.11;
 return {time:base+i*900,open:price-1,high:price+3,low:price-4,close:price+1,
  tick_volume:800+i*2,real_volume:0};
});
window.__chartSmokeCandles=candles;
window.__notifications=[];window.__notificationPermissionCalls=0;
window.Notification=class {static permission="default";static async requestPermission(){window.__notificationPermissionCalls++;this.permission="granted";return this.permission}constructor(title,options){window.__notifications.push({title,options})}};
candleSeries.setData(candles);
emas.forEach((series,j)=>series.setData(candles.map(c=>({time:c.time,value:c.close-2+j}))));
chart.timeScale().fitContent();
window.StoneChartFX.attach({chart,host,candleSeries,emaSeries:emas});
window.StoneChartFX.update({candles,emas:emas.map((_,j)=>candles.map(c=>({time:c.time,value:c.close-2+j}))),context:"fixture/titan/M15"});
ChartStudioBeta.mount({chart,host,candleSeries,emaSeries:emas,account:"titan",timeframe:"M15"});
ChartStudioBeta.updateCandles(candles);
ChartStudioBeta.updatePositions("titan",[
{ticket:101,type:"BUY",open_price:4110,sl_price:4104,tp_price:4122,profit_usd:33,volume:.1}
]);
window.__chartSmokeReady=true;
</script></body></html>
