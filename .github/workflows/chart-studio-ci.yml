name: Chart Studio implementation tests
on:
  push:
    branches:
      - test/chart-studio-implementation
      - test/chart-studio-phase2
      - test/chart-studio-drag-preview
      - test/chart-studio-sqlite-workspaces
      - test/chart-studio-adx-vwap
      - test/chart-studio-advanced-drawings
      - test/chart-studio-configurable-averages
      - test/chart-studio-chart-appearance
      - test/chart-studio-oscillator-instances
      - test/chart-studio-chart-types
      - test/chart-studio-object-manager
      - test/chart-studio-incremental-render
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dashboard dependencies
        run: python -m pip install numpy pandas MetaTrader5 fastapi uvicorn httpx pydantic
      - name: Compile Python
        run: python -m compileall -q app.py chart_studio tests
      - name: Check browser scripts and chart math
        run: |
          node --check static/chart-studio-replay.js
          node --check static/chart-studio-fib.js
          node scripts/test_chart_studio_fib.cjs
          node --check static/chart-studio-beta.js
          node --check static/chart-studio-data-signature.js
          node scripts/test_chart_studio_data_signature.cjs
          node --check static/chart-studio-object-manager.js
          node --check static/chart-studio-drawing-geometry.js
          node scripts/test_chart_studio_drawings.cjs
          node --check static/chart-studio-server-sync.js
          node --check static/chart-studio-indicators.js
          node --check static/chart-studio-oscillators.js
          node --check static/chart-studio-chart-types.js
          node scripts/test_chart_studio_chart_types.cjs
          node scripts/test_chart_studio_oscillators.cjs
          node --check static/chart-studio-catalog.js
          node --check static/chart-studio-averages.js
          node --check static/chart-studio-appearance.js
          node scripts/test_chart_studio_appearance.cjs
          node scripts/test_chart_studio_averages.cjs
          node scripts/test_chart_studio_indicators.cjs
          node --check static/stone-chart-effects.js
          node scripts/test_chart_studio_math.cjs
          python scripts/check_frontend_syntax.py
      - name: Run tests
        env:
          GOLDM15_PRESET: goldm15/GoldM15_Reconstruction.set
        run: python -m unittest discover -s tests -v
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Compile native v5 TypeScript adapter (isolated)
        working-directory: chart_studio_v5
        run: |
          npm install --package-lock=false --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Chromium native v5 proof (read-only)
        run: node scripts/smoke_chart_studio_v5.cjs
      - name: Run Chromium UI smoke (no MT5 server)
        run: |
          node scripts/smoke_chart_studio_replay.cjs
          node scripts/smoke_chart_studio_responsive.cjs
          node scripts/smoke_chart_studio_fib.cjs
          node scripts/smoke_chart_studio_beta.cjs
          node scripts/smoke_chart_studio_averages.cjs
          node scripts/smoke_chart_studio_appearance.cjs
          node scripts/smoke_chart_studio_oscillators.cjs
          node scripts/smoke_chart_studio_chart_types.cjs
          node scripts/smoke_chart_studio_objects.cjs
          node scripts/smoke_chart_studio_incremental.cjs
      - name: Upload Chart Studio browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-studio-beta-screenshot
          path: |
            output/visual-smoke/chart-studio-replay.png
            output/visual-smoke/chart-studio-responsive-*.png
            output/visual-smoke/chart-studio-fibonacci-levels.png
            output/visual-smoke/chart-studio-beta.png
            output/visual-smoke/chart-studio-multi-ma.png
            output/visual-smoke/chart-studio-appearance.png
            output/visual-smoke/chart-studio-oscillators.png
            output/visual-smoke/chart-studio-chart-types.png
            output/visual-smoke/chart-studio-object-manager.png
            output/visual-smoke/chart-studio-incremental.png
            output/visual-smoke/chart-studio-v5-poc.png
          if-no-files-found: ignore
