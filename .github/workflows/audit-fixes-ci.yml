name: Test performance and UX fixes

on:
  push:
    branches:
      - test/performance-ux-audit-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MT5 and test dependencies
        run: python -m pip install --upgrade numpy pandas MetaTrader5 fastapi uvicorn httpx pydantic
      - name: Check Python compilation
        run: python -m compileall -q app.py account_gateway.py goldm15_dashboard.py scripts tests
      - name: Check browser JavaScript
        shell: pwsh
        run: |
          node --check static/stone-chart-effects.js
          node --check static/stone-celebrations.js
          node --check static/stone-cockpit.js
          python scripts/check_frontend_syntax.py
      - name: Run isolated unit and contract suite
        env:
          GOLDM15_PRESET: ${{ github.workspace }}\goldm15\GoldM15_Reconstruction.set
        run: python -m unittest discover -s tests -v

      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Render Stone demo on Chromium
        run: node scripts/smoke_stone_preview.cjs
      - name: Save responsive smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stone-preview-screenshots
          path: output/visual-smoke/*.png
          if-no-files-found: ignore

  optimize-stone-assets:
    if: github.event_name == 'push' && github.ref_name == 'test/performance-ux-audit-fixes'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build dependencies
        run: |
          python -m pip install pillow
          npm install --no-save tailwindcss@3.4.17
      - name: Compile production CSS
        run: npx tailwindcss -c tailwind.config.cjs -i static/tailwind.input.css -o static/tailwind.generated.css --minify
      - name: Verify lossless image conversion
        run: python scripts/optimize_stone_assets.py
      - name: Commit generated assets only to test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/tailwind.generated.css static/stone-asset-skin.css static/stone-cockpit.css static/stone-assets/optimized-assets.json static/stone-assets/ready/
          if ! git diff --cached --quiet; then
            git commit -m "assets: built Tailwind and pixel-verified lossless Stone images"
            git push origin HEAD:refs/heads/test/performance-ux-audit-fixes
          fi
