name: MT5 Backtesting Contracts
on:
  pull_request:
    paths:
      - 'backtesting/**'
      - 'tests/test_mt5_batch_backtesting.py'
      - 'tests/test_mt5_backtest_analytics.py'
      - '.github/workflows/backtesting-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -p 'test_mt5_backtest*.py' -v
      - run: python -m unittest discover -s tests -p 'test_mt5_batch_backtesting.py' -v
